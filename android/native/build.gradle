apply plugin: 'com.android.library'
apply plugin: 'de.undercouch.download' // ЭТА СТРОКА ТЕПЕРЬ РАБОТАЕТ

android {
    // УКАЗЫВАЕМ SDK ДЛЯ NATIVE-МОДУЛЯ:
    compileSdkVersion 34
    buildToolsVersion "34.0.0"
    ndkVersion "25.2.9519653"

    defaultConfig {
        minSdkVersion 21
        targetSdkVersion 34
        versionCode 1
        versionName "1.0"
    }

    externalNativeBuild {
        cmake {
            path "../../CMakeLists.txt"
            version "3.22.1"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
}

// Задача для скачивания зависимостей
task downloadDeps(type: Download) {
    src 'https://github.com/luanti-org/luanti_android_deps/releases/download/latest/deps-lite.zip'
    dest new File(buildDir, 'deps-lite.zip')
    overwrite false
}

task unzipDeps(dependsOn: downloadDeps, type: Copy) {
    from zipTree(downloadDeps.dest)
    into "${projectDir}/deps"
}

preBuild.dependsOn unzipDeps
